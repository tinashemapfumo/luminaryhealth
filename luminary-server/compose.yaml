services:
  api:
    build: .
    image: luminary-server:local
    container_name: luminary-server
    env_file:
      - .env
    environment:
      PORT: "4000"
      CLIENT_FILE_STORAGE_PATH: /app/client-files
      SHOW_TEST_PRACTICES: "true"
      WEB_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./client-files:/app/client-files
