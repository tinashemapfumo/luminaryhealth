services:
  db-demo:
    image: postgres:16-alpine
    container_name: luminary-db-demo
    environment:
      POSTGRES_DB: luminary_demo
      POSTGRES_USER: luminary_app
      POSTGRES_PASSWORD: luminary_demo
    ports:
      - "54321:5432"
    volumes:
      - luminary-db-demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminary_app -d luminary_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

  api-demo:
    build: .
    image: luminary-server:local-demo
    container_name: luminary-server-demo
    env_file:
      - env/local.demo.env
    environment:
      PORT: "4001"
      DATABASE_URL: postgres://luminary_app:luminary_demo@db-demo:5432/luminary_demo
      CLIENT_FILE_STORAGE_PATH: /app/client-files
      WEB_ORIGINS: http://127.0.0.1:5175,http://localhost:5175
      SHOW_TEST_PRACTICES: "true"
    depends_on:
      db-demo:
        condition: service_healthy
    ports:
      - "4001:4001"
    volumes:
      - ./client-files-demo:/app/client-files

volumes:
  luminary-db-demo:
